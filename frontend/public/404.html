<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>404 — Page Not Found · MindForm</title>
  <link rel="icon" type="image/png" href="/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-base: #0b0c10;
      --bg-elevated: rgba(22, 24, 30, 0.75);
      --text-primary: #ffffff;
      --text-secondary: #94a3b8;
      --brand-primary: #0a84ff;
      --brand-warning: #f59e0b;
      --border-bright: rgba(255, 255, 255, 0.08);
      --font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', system-ui, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg-base);
      color: var(--text-primary);
      font-family: var(--font-family);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      overflow-x: hidden;
      position: relative;
    }
    .ambient {
      position: absolute;
      top: -25%;
      left: 50%;
      transform: translateX(-50%);
      width: 120vw;
      max-width: 1200px;
      height: 700px;
      background: radial-gradient(ellipse at center, rgba(10, 132, 255, 0.14) 0%, rgba(94, 92, 230, 0.08) 40%, transparent 70%);
      filter: blur(35px);
      pointer-events: none;
      z-index: 0;
    }
    .card {
      position: relative;
      z-index: 2;
      max-width: 520px;
      width: 100%;
      text-align: center;
      padding: 44px 32px;
      border-radius: 24px;
      background: var(--bg-elevated);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-bright);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
    }
    .brand img {
      width: 36px;
      height: 36px;
      border-radius: 9px;
      object-fit: contain;
    }
    .brand span {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.3);
      color: var(--brand-warning);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 16px;
    }
    .code {
      font-size: clamp(4.5rem, 12vw, 6.5rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1;
      margin-bottom: 16px;
      background: linear-gradient(180deg, #ffffff 40%, rgba(10, 132, 255, 0.6) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    h1 {
      font-size: clamp(20px, 3.5vw, 24px);
      font-weight: 700;
      margin-bottom: 12px;
      letter-spacing: -0.02em;
    }
    p {
      font-size: 15px;
      color: var(--text-secondary);
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn-primary {
      padding: 12px 26px;
      font-size: 14.5px;
      font-weight: 600;
      background: var(--brand-primary);
      color: #ffffff;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: transform 0.2s, filter 0.2s;
    }
    .btn-primary:hover {
      transform: scale(1.02);
      filter: brightness(1.08);
    }
    .btn-secondary {
      padding: 12px 22px;
      font-size: 14.5px;
      font-weight: 600;
      background: rgba(255, 255, 255, 0.06);
      color: #ffffff;
      border: 1px solid var(--border-bright);
      border-radius: 999px;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: background 0.2s;
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.12);
    }
    .footer {
      margin-top: 28px;
      font-size: 12.5px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="ambient" aria-hidden="true"></div>
  <div class="card">
    <div class="brand">
      <img src="/logo.png" alt="MindForm" />
      <span>MindForm</span>
    </div>
    <div>
      <span class="badge">404 Error</span>
    </div>
    <div class="code">404</div>
    <h1>Lost in the stream.</h1>
    <p>The page you are looking for has moved, expired, or never existed in this dimension.</p>
    <div class="actions">
      <a href="/" class="btn-primary">Return Home</a>
      <a href="javascript:history.back()" class="btn-secondary">Go Back</a>
    </div>
  </div>
  <div class="footer">MindForm Resilience System</div>
</body>
</html>
